<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiches COVER</title>
<style>
  :root { --rouge: #C8102E; --noir: #111111; --gris: #666666; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #E9E9E9; color: var(--noir); font-family: "Helvetica Neue", Arial, sans-serif; }

  /* Barre d'outils (non imprimée) */
  .outils {
    position: sticky; top: 0; z-index: 2; background: var(--noir); color: #FFF;
    display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 12px 16px; font-size: 15px;
  }
  .outils b { font-weight: 900; text-transform: uppercase; }
  .outils label { display: flex; gap: 6px; align-items: center; }
  .outils input { width: 70px; font: inherit; padding: 6px 8px; border: 0; border-radius: 4px; }
  .outils button { font: inherit; font-weight: 800; text-transform: uppercase; border: 0; border-radius: 4px; padding: 8px 16px; cursor: pointer; background: #FFF; color: var(--noir); }
  .outils button.imprimer { background: var(--rouge); color: #FFF; }
  .outils .aide { color: #BBB; font-size: 13px; flex-basis: 100%; }

  /* Pages A4 avec 4 fiches A6 (105 x 148 mm) */
  @page { size: A4 portrait; margin: 0; }
  .page {
    width: 210mm; height: 297mm; margin: 10mm auto; background: #FFF;
    display: grid; grid-template-columns: 105mm 105mm; grid-template-rows: 148.5mm 148.5mm;
    position: relative; overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,.15);
  }
  /* Traits de coupe */
  .page::before, .page::after { content: ""; position: absolute; pointer-events: none; }
  .page::before { left: 105mm; top: 0; bottom: 0; border-left: .2mm dashed #AAA; }
  .page::after { top: 148.5mm; left: 0; right: 0; border-top: .2mm dashed #AAA; }

  .fiche { display: flex; flex-direction: column; overflow: hidden; }
  .corps { flex: 1; min-height: 0; padding: 6mm 7mm 3mm; display: flex; flex-direction: column; gap: 2.6mm; }
  .talon { flex: none; height: 17mm; border-top: .3mm dashed #888; position: relative; display: flex; align-items: center; justify-content: space-between; gap: 4mm; padding: 0 7mm; }
  .talon::before { content: "\2702"; position: absolute; left: 3mm; top: -2.6mm; font-size: 9pt; line-height: 1; background: #FFF; color: #555; padding: 0 .6mm; }
  .talon .t-txt { font-size: 7.4pt; font-weight: 700; line-height: 1.3; }
  .talon .t-txt b { display: block; font-size: 8.4pt; font-weight: 900; text-transform: uppercase; }
  .talon .t-num { font-weight: 900; font-size: 22pt; letter-spacing: .04em; white-space: nowrap; }
  .talon .t-num small { font-size: 8pt; margin-right: 1mm; }
  .entete { display: flex; justify-content: space-between; align-items: flex-start; gap: 3mm; border-bottom: .9mm solid var(--rouge); padding-bottom: 2mm; }
  .marque { font-weight: 900; font-size: 17pt; letter-spacing: .08em; }
  .titre { font-weight: 900; text-transform: uppercase; font-size: 13pt; line-height: 1.05; }
  .titre span { color: var(--rouge); }
  .infos { font-size: 8pt; font-weight: 700; color: var(--gris); margin-top: 1mm; line-height: 1.3; }
  .champs { display: flex; flex-direction: column; gap: 2.4mm; margin-top: 1mm; }
  .champ { display: flex; align-items: flex-end; gap: 2mm; font-size: 9.5pt; font-weight: 800; text-transform: uppercase; }
  .champ .ligne { flex: 1; border-bottom: .3mm solid var(--noir); height: 7.4mm; }
  .champ small { font-weight: 600; text-transform: none; color: var(--gris); font-size: 7.5pt; }
  .case { display: flex; gap: 2.4mm; align-items: flex-start; font-size: 8.6pt; line-height: 1.25; }
  .case .carre { flex: none; width: 4.6mm; height: 4.6mm; border: .35mm solid var(--noir); margin-top: .2mm; }
  .case b { font-weight: 800; }
  .case em { font-style: normal; color: var(--gris); }
  .rgpd { font-size: 6.3pt; line-height: 1.3; color: #333; margin-top: auto; }
  .pied { display: flex; justify-content: space-between; align-items: flex-end; border-top: .3mm solid var(--noir); padding-top: 1.6mm; }
  .pied .gratuit { font-size: 7.2pt; font-weight: 700; color: var(--gris); max-width: 60mm; line-height: 1.25; }
  .numero { font-weight: 900; font-size: 20pt; letter-spacing: .04em; }
  .numero small { font-size: 8pt; font-weight: 800; margin-right: 1mm; }

  @media print {
    body { background: #FFF; }
    .outils { display: none; }
    .page { margin: 0; box-shadow: none; break-after: page; page-break-after: always; }
    .page:last-child { break-after: auto; page-break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div class="outils">
  <b>Fiches de participation</b>
  <label>De <input id="de" type="number" min="1" max="300" value="1"></label>
  <label>à <input id="a" type="number" min="1" max="300" value="300"></label>
  <button id="generer">Mettre à jour</button>
  <button class="imprimer" onclick="window.print()">Imprimer</button>
  <span class="aide">Imprimez en A4, échelle 100 % (« taille réelle »), sans marges ajoutées. 4 fiches par page, à découper le long des pointillés. Chaque fiche a un talon détachable que le client garde. 300 fiches = 75 pages.</span>
</div>
<div id="pages"></div>

<template id="modele">
  <div class="fiche">
   <div class="corps">
    <div class="entete">
      <div>
        <div class="titre">La roulette COVER<br><span>Gagnez une doudoune Calvin Klein</span></div>
        <div class="infos">Valeur 200 €. Jeu du 5 au 12 décembre 2026, tirage au sort le dimanche 13 décembre 2026.</div>
      </div>
      <div class="marque">COVER</div>
    </div>

    <div class="champs">
      <div class="champ">Nom <span class="ligne"></span></div>
      <div class="champ">Prénom <span class="ligne"></span></div>
      <div class="champ">Téléphone <span class="ligne"></span></div>
      <div class="champ">E-mail <small>(facultatif)</small> <span class="ligne"></span></div>
    </div>

    <div class="case"><span class="carre"></span><span><b>J'ai 18 ans ou plus et j'ai pris connaissance du règlement.</b> <em>(obligatoire)</em></span></div>
    <div class="case"><span class="carre"></span><span>J'accepte de recevoir les offres et nouveautés de COVER par e-mail et SMS. <em>(facultatif, sans effet sur la participation)</em></span></div>

    <p class="rgpd">Données personnelles : vos coordonnées servent uniquement au tirage au sort et à contacter le gagnant. Elles sont conservées 3 mois après le tirage, puis détruites. Si vous avez coché la case des offres, nous gardons votre e-mail et votre téléphone pour vous écrire pendant 3 ans après votre dernier contact avec nous. Vous pouvez demander l'accès à vos données, leur correction ou leur suppression à coverbesancon25@gmail.com, et faire une réclamation auprès de la CNIL. Responsable du traitement : [nom légal de COVER].</p>

    <div class="pied">
      <div class="gratuit">Gratuit et sans obligation d'achat. Une fiche par personne. Règlement disponible en caisse.</div>
      <div class="numero"><small>N°</small><span class="num"></span></div>
    </div>
   </div>
    <div class="talon">
      <div class="t-txt"><b>Talon à garder</b>Tapez ce numéro sur la tablette pour tourner la roue.</div>
      <div class="t-num"><small>N°</small><span class="num"></span></div>
    </div>
  </div>
</template>

<script>
(function () {
  function pad(n) { return String(n).padStart(3, '0'); }
  function generer() {
    var de = Math.max(1, Math.min(300, parseInt(document.getElementById('de').value, 10) || 1));
    var a = Math.max(de, Math.min(300, parseInt(document.getElementById('a').value, 10) || 300));
    var cible = document.getElementById('pages');
    var modele = document.getElementById('modele');
    cible.innerHTML = '';
    var page = null;
    for (var n = de; n <= a; n++) {
      if ((n - de) % 4 === 0) {
        page = document.createElement('div');
        page.className = 'page';
        cible.appendChild(page);
      }
      var f = modele.content.cloneNode(true);
      f.querySelectorAll('.num').forEach(function (e) { e.textContent = pad(n); });
      page.appendChild(f);
    }
  }
  document.getElementById('generer').addEventListener('click', generer);
  generer();
})();
</script>
</body>
</html>
