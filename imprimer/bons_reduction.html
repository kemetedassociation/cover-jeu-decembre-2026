<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bons COVER -5 %</title>
<style>
  :root { --rouge: #C8102E; --noir: #111111; --gris: #666666; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #E9E9E9; color: var(--noir); font-family: "Helvetica Neue", Arial, sans-serif; }

  .outils {
    position: sticky; top: 0; z-index: 2; background: var(--noir); color: #FFF;
    display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 12px 16px; font-size: 15px;
  }
  .outils b { font-weight: 900; text-transform: uppercase; }
  .outils label { display: flex; gap: 6px; align-items: center; }
  .outils input { width: 70px; font: inherit; padding: 6px 8px; border: 0; border-radius: 4px; }
  .outils button { font: inherit; font-weight: 800; text-transform: uppercase; border: 0; border-radius: 4px; padding: 8px 16px; cursor: pointer; background: #FFF; color: var(--noir); }
  .outils button.imprimer { background: var(--rouge); color: #FFF; }
  .outils .aide { color: #BBB; font-size: 13px; flex-basis: 100%; }

  /* 10 bons par A4 : 2 colonnes x 5 rangées de 105 x 59,4 mm */
  @page { size: A4 portrait; margin: 0; }
  .page {
    width: 210mm; height: 297mm; margin: 10mm auto; background: #FFF;
    display: grid; grid-template-columns: 105mm 105mm; grid-template-rows: repeat(5, 59.4mm);
    box-shadow: 0 2px 12px rgba(0,0,0,.15);
  }
  .bon { border-right: .2mm dashed #AAA; border-bottom: .2mm dashed #AAA; padding: 5mm 6mm; display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto 1fr auto; gap: 1.5mm 4mm; overflow: hidden; }
  .bon:nth-child(2n) { border-right: 0; }
  .haut { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; border-bottom: .8mm solid var(--rouge); padding-bottom: 1.5mm; }
  .marque { font-weight: 900; letter-spacing: .12em; font-size: 12pt; }
  .num { font-weight: 900; font-size: 14pt; letter-spacing: .03em; }
  .remise { font-weight: 900; font-size: 34pt; line-height: 1; color: var(--rouge); align-self: center; }
  .remise small { display: block; font-size: 8pt; color: var(--noir); letter-spacing: .02em; text-transform: uppercase; margin-top: 1mm; }
  .champs { font-size: 8.4pt; font-weight: 700; display: flex; flex-direction: column; gap: 2.6mm; align-self: center; }
  .champs span { display: inline-block; border-bottom: .3mm solid var(--noir); width: 26mm; margin-left: 1.5mm; }
  .conditions { grid-column: 1 / -1; font-size: 6.4pt; color: #333; line-height: 1.3; }

  @media print {
    body { background: #FFF; }
    .outils { display: none; }
    .page { margin: 0; box-shadow: none; break-after: page; }
    .page:last-child { break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div class="outils">
  <b>Bons de réduction</b>
  <label>De B-<input id="de" type="number" min="1" max="999" value="1"></label>
  <label>à B-<input id="a" type="number" min="1" max="999" value="160"></label>
  <button id="generer">Mettre à jour</button>
  <button class="imprimer" onclick="window.print()">Imprimer</button>
  <span class="aide">Quand la tablette affiche « Gagné », remettez au client le bon du même numéro, après avoir noté la fiche et la date limite affichées à l'écran. 160 bons = 16 pages (300 fiches et au plus 2 tours chacune donnent environ 150 gagnants au maximum).</span>
</div>
<div id="pages"></div>

<template id="modele">
  <div class="bon">
    <div class="haut"><span class="marque">COVER</span><span class="num"></span></div>
    <div class="remise">-5 %<small>Bon de réduction</small></div>
    <div class="champs">
      <div>Fiche n°<span></span></div>
      <div>Valable jusqu'au<span></span></div>
      <div>Visa vendeur<span></span></div>
    </div>
    <div class="conditions">Valable 7 jours, jour du gain compris, à la boutique COVER, 6 b rue Pasteur, Passages Pasteur, Besançon. Un seul passage en caisse, non cumulable avec une autre réduction ou promotion, non échangeable contre de l'argent. Roulette COVER, décembre 2026.</div>
  </div>
</template>

<script>
(function () {
  function pad(n) { return String(n).padStart(3, '0'); }
  function generer() {
    var de = Math.max(1, Math.min(999, parseInt(document.getElementById('de').value, 10) || 1));
    var a = Math.max(de, Math.min(999, parseInt(document.getElementById('a').value, 10) || 160));
    var cible = document.getElementById('pages');
    var modele = document.getElementById('modele');
    cible.innerHTML = '';
    var page = null;
    for (var n = de; n <= a; n++) {
      if ((n - de) % 10 === 0) {
        page = document.createElement('div');
        page.className = 'page';
        cible.appendChild(page);
      }
      var b = modele.content.cloneNode(true);
      b.querySelector('.num').textContent = 'B-' + pad(n);
      page.appendChild(b);
    }
  }
  document.getElementById('generer').addEventListener('click', generer);
  generer();
})();
</script>
</body>
</html>
