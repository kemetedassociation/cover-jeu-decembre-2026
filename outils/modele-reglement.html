<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Règlement roulette COVER</title>
<meta name="description" content="Règlement du jeu gratuit et sans obligation d'achat de la boutique COVER, Passages Pasteur, Besançon, du 5 au 12 décembre 2026.">
<meta name="theme-color" content="#C8102E">
<style>
  :root { --rouge: #C8102E; --noir: #111111; --fond: #FFFFFF; --texte: #1A1A1A; --doux: #5A5A5A; --trait: #E4E4E4; }
  @media (prefers-color-scheme: dark) {
    :root { --fond: #121212; --texte: #EDEDED; --doux: #A8A8A8; --trait: #2C2C2C; --rouge: #FF4D63; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--fond); color: var(--texte); font-family: "Helvetica Neue", Arial, system-ui, sans-serif; font-size: 17px; line-height: 1.6; }
  header { background: #C8102E; color: #FFFFFF; padding: 28px 16px 24px; }
  .bandeau-interieur, main { max-width: 760px; margin: 0 auto; }
  .marque { font-weight: 900; letter-spacing: .14em; font-size: 15px; }
  h1 { font-weight: 900; text-transform: uppercase; font-size: clamp(26px, 6vw, 40px); line-height: 1.05; margin-top: 10px; }
  .sous-titre { font-weight: 700; margin-top: 10px; }
  main { padding: 8px 16px 48px; }
  .sommaire { border-bottom: 1px solid var(--trait); padding: 18px 0; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .sommaire button { font: inherit; font-weight: 800; text-transform: uppercase; font-size: 14px; border: 2px solid var(--texte); background: none; color: var(--texte); padding: 8px 14px; border-radius: 6px; cursor: pointer; }
  h2 { color: var(--rouge); text-transform: uppercase; font-weight: 900; font-size: 18px; margin: 30px 0 10px; letter-spacing: .01em; }
  p { margin-bottom: 12px; }
  ul { margin: 0 0 12px 22px; }
  li { margin-bottom: 6px; }
  strong { font-weight: 800; }
  .fin { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--trait); color: var(--doux); }
  @media print {
    :root { --fond: #FFF; --texte: #000; --rouge: #C8102E; }
    body { font-size: 11pt; }
    .sommaire { display: none; }
    header { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<header>
  <div class="bandeau-interieur">
    <div class="marque">COVER · BESANÇON</div>
    <h1>{{TITRE}}</h1>
    <div class="sous-titre">{{SOUS_TITRE}}</div>
  </div>
</header>
<main>
  <div class="sommaire">
    <button onclick="window.print()">Imprimer ou enregistrer en PDF</button>
  </div>
  {{ARTICLES}}
  <div class="fin">{{FIN}}</div>
</main>
</body>
</html>
